when:
  - event: pull_request
  - event: pull_request_edited
  - event: push
    branch:
      - main

steps:
  paired-pr:
    when:
      - event: pull_request
      - event: pull_request_edited
    image: reg.ricochet.rs/docker.io/library/alpine:3.24
    environment:
      GH_TOKEN:
        from_secret:
          integration: 1
          path: github/pat/agent_instructions_token
          key: token
      FORGE_TOKEN:
        from_secret:
          integration: 1
          path: codefloe/pat/ricochet-bot/main
          key: token
    commands:
      - apk add -q --no-cache curl git github-cli jq
      - git clone -q --depth=1 https://github.com/ricochet-rs/agent-instructions.git /tmp/agent-instructions
      - /tmp/agent-instructions/scripts/paired-instructions-pr.sh check https://codefloe.com "$${CI_REPO}" "$${CI_COMMIT_PULL_REQUEST}"

  merge-paired-pr:
    when:
      - event: push
        branch:
          - main
    image: reg.ricochet.rs/docker.io/library/alpine:3.24
    environment:
      GH_TOKEN:
        from_secret:
          integration: 1
          path: github/pat/agent_instructions_token
          key: token
      FORGE_TOKEN:
        from_secret:
          integration: 1
          path: codefloe/pat/ricochet-bot/main
          key: token
    commands:
      - apk add -q --no-cache curl git github-cli jq
      - git clone -q --depth=1 https://github.com/ricochet-rs/agent-instructions.git /tmp/agent-instructions
      - /tmp/agent-instructions/scripts/paired-instructions-pr.sh merge-for-commit https://codefloe.com "$${CI_REPO}" "$${CI_COMMIT_SHA}"
