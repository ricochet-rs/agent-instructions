name: Instructions

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: instructions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired-pr:
    name: Validate paired instructions PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      EFFECTIVE_PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.agent_instructions_token }}
    steps:
      - name: Load shared instructions
        run: git clone --quiet --depth=1 https://github.com/ricochet-rs/agent-instructions.git "$RUNNER_TEMP/agent-instructions"
      - name: Validate paired instructions PR
        run: >-
          "$RUNNER_TEMP/agent-instructions/scripts/paired-instructions-pr.sh"
          check https://github.com "$GITHUB_REPOSITORY" "$EFFECTIVE_PR"

  merge-paired-pr:
    name: Merge paired instructions PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.agent_instructions_token }}
    steps:
      - name: Load shared instructions
        run: git clone --quiet --depth=1 https://github.com/ricochet-rs/agent-instructions.git "$RUNNER_TEMP/agent-instructions"
      - name: Merge paired instructions PR
        run: >-
          "$RUNNER_TEMP/agent-instructions/scripts/paired-instructions-pr.sh"
          merge-for-commit https://github.com "$GITHUB_REPOSITORY" "$GITHUB_SHA"
