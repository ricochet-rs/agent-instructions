when:
  - event:
      - pull_request
      - pull_request_edited
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

labels:
  agent: thumper

steps:
  - name: repository
    image: reg.ricochet.rs/docker.io/library/alpine:3.24
    depends_on: []
    commands:
      - apk add -q --no-cache curl jq py3-yaml python3 ripgrep shellcheck
      - scripts/check.sh

  - name: python-and-yaml
    image: reg.ricochet.rs/docker.io/library/python:3.14-slim
    depends_on: []
    commands:
      - pip install --no-cache-dir ruff==0.16.0 yamllint==1.38.0
      - ruff format --check scripts/validate_resources.py
      - ruff check scripts/validate_resources.py
      - yamllint --strict -c .yamllint.yaml .

  - name: markdown
    image: reg.ricochet.rs/docker.io/oven/bun:1.3.6-alpine
    depends_on: []
    commands:
      - bunx markdownlint-cli2@0.22.1

  - name: actionlint
    image: reg.ricochet.rs/docker.io/rhysd/actionlint:1.7.12
    depends_on: []
    commands:
      - actionlint templates/github-instructions.yaml

  - name: zizmor
    image: reg.ricochet.rs/ghcr.io/zizmorcore/zizmor:1.25.2
    depends_on: []
    commands:
      - zizmor --pedantic templates/github-instructions.yaml

  - name: crow
    image: codefloe.com/crowci/crow-cli:v6.4.0
    depends_on: []
    commands:
      - crow lint --strict .crow/
      - crow lint --strict templates/crow-instructions.yaml
      - crow lint --strict templates/codefloe-crow-instructions.yaml
